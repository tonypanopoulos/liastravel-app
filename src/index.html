<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline';">
  <title>Lia's Travel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #1a3a6b; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: fixed;
      top: 0; left: 0;
    }
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #1a3a6b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #loading h1 {
      color: white;
      font-family: serif;
      font-size: 28px;
      margin-bottom: 10px;
    }
    #loading p {
      color: rgba(255,255,255,0.7);
      font-family: sans-serif;
      font-size: 14px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h1>Lia's Travel</h1>
    <p>Φορτών͵ι...</p>
  </div>

  <iframe
    id="main-frame"
    src="https://liastravel.com"
    allow="geolocation; camera; microphone"
    onload="hideLoader()"
  ></iframe>

  <script>
    function hideLoader() {
      var loader = document.getElementById('loading');
      loader.style.opacity = '0';
      setTimeout(function() { loader.style.display = 'none'; }, 500);
    }

    // Hide loader after max 5 seconds
    setTimeout(hideLoader, 5000);

    // Handle back button on Android
    document.addEventListener('ionBackButton', function(ev) {
      ev.detail.register(10, function() {
        var frame = document.getElementById('main-frame');
        try { frame.contentWindow.history.back(); } catch(e) {}
      });
    });
  </script>
</body>
</html>
