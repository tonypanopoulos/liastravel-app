name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Επιτρέπει manual trigger από το GitHub UI

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      # 1. Κατέβασε τον κώδικα
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Εγκατάστησε Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Εγκατάστησε Java (χρειάζεται για Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Εγκατάστησε dependencies
      - name: Install dependencies
        run: npm install

      # 5. Εγκατάστησε Capacitor CLI
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      # 6. Πρόσθεσε Android platform (αν δεν υπάρχει ήδη)
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # 7. Sync αρχεία
      - name: Sync Capacitor
        run: npx cap sync android

      # 8. Αντέγραψε τις ρυθμίσεις μας
      - name: Apply Android config
        run: |
          cp android-config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android-config/strings.xml android/app/src/main/res/values/strings.xml
          cp android-config/styles.xml android/app/src/main/res/values/styles.xml
          mkdir -p android/app/src/main/res/xml
          cp android-config/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml

      # 9. Δώσε δικαιώματα στο Gradle
      - name: Grant Gradle permissions
        run: chmod +x android/gradlew

      # 10. Build DEBUG APK (για testing — δεν χρειάζεται keystore)
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # 11. Build RELEASE AAB (για Play Store — χρειάζεται keystore)
      - name: Build Release AAB
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 --decode > android/app/liastravel.keystore
            cd android
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=app/liastravel.keystore \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
              --stacktrace
          else
            echo "Keystore δεν έχει οριστεί - παράλειψη release build"
          fi

      # 12. Ανέβασε τα artifacts (APK/AAB)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: liastravel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: liastravel-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      # 13. Δημιούργησε GitHub Release αυτόματα
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Lia's Travel v${{ github.run_number }}"
          body: "Αυτόματο build από GitHub Actions"
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
